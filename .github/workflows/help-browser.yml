name: Arrival help action screens
on:
  pull_request:
permissions:
  contents: read
jobs:
  help-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned help screen browser
        run: |
          npm install --prefix "$RUNNER_TEMP/arrival-help-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/arrival-help-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual help actions and current location contacts
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/arrival-help-browser/node_modules/playwright
          BROWSER_REPORT: ${{ runner.temp }}/arrival-help-report
        run: node tools/help-browser.mjs
      - name: Keep scoped screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrival-help-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/arrival-help-report
          if-no-files-found: error
          retention-days: 7
